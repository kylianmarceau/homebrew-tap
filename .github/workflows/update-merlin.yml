name: Update Merlin cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-merlin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Check latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_cask.py
      - name: Commit cask update
        run: |
          if git diff --quiet -- Casks/merlin.rb; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/merlin.rb
          git commit -m 'Update Merlin to the latest stable release'
          git push
